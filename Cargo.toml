[package]
name = "rust_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql", "chrono", "bigdecimal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
bcrypt = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
hmac = "0.12"
digest = "0.10"
thiserror = "1.0"
tower-http = { version = "0.5", features = ["fs", "cors"] }
base64 = "0.22"
dashmap = "6.2.1"
teloxide = { version = "0.17.0", features = ["macros", "rustls"] }
grammers-client = { version = "0.10.0", features = ["markdown"] }
lazy_static = "1.5.0"



[[bin]]
name = "rust_backend"
path = "src/main.rs"

[[bin]]
name = "store_gateway"
path = "src/bin/store_gateway.rs"

[[bin]]
name = "fulfillment_service"
path = "src/bin/fulfillment_service.rs"




<body class="text-white antialiased bg-[#0f172a]">
    <div class="jsx-1305739042 __className_a8b5ca font-sans" x-data="forgotData()">
        <div class="relative flex min-h-screen items-center justify-center px-4 sm:px-32">
            <div class="absolute top-4 left-4 z-20">
                <a class="inline-flex items-center justify-center rounded-md !bg-murky-700 !p-2 hover:!bg-murky-800 text-white" href="/" style="outline: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </a>
            </div>
            <div class="absolute inset-0 z-10 bg-gradient-to-b from-gray-900/90 to-gray-900/50"></div>
            <div class="z-20 w-full">
                <div class="mx-auto w-full max-w-md space-y-8 lg:mx-0 mt-5">
                    <div class="relative backdrop-blur-2xl bg-white/10 p-8 rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
                        <div class="relative z-10">
                            <div>
                                <div class="flex justify-center mb-4">
                                    <img src="/imagehome/Footeraru.png" alt="Logo" class="h-16 w-auto" />
                                </div>
                                <h2 class="mt-2 text-2xl font-bold tracking-tight text-white sm:text-3xl text-center">Lupa Password</h2>
                                <p class="mt-2 text-sm text-white/70 text-center">Masukkan nomor WhatsApp terdaftar. Password baru akan dikirim via WhatsApp.</p>
                            </div>
                            <div x-show="message" x-cloak class="mt-4 rounded-lg bg-green-500/10 border border-green-500/30 p-3 text-sm text-green-300" x-text="message"></div>
                            <div x-show="error" x-cloak class="mt-4 rounded-lg bg-red-500/10 border border-red-500/30 p-3 text-sm text-red-300" x-text="error"></div>
                            <form @submit.prevent="doReset" class="mt-8 space-y-6">
                                <div>
                                    <label for="phone" class="block text-sm font-medium text-white/90 pb-2">No. WhatsApp</label>
                                    <input id="phone" x-model="phone" type="tel" required class="relative block w-full appearance-none rounded-md border-0 bg-murky-200 px-3 py-2 text-xs text-murky-800 placeholder-murky-800 focus:z-10 focus:outline-none focus:bg-white" placeholder="08xxxxxxxxxx">
                                </div>
                                <button type="submit" class="group relative flex w-full justify-center rounded-md bg-primary-500 px-4 py-2 text-sm font-medium text-white duration-300 hover:bg-primary-400 focus:outline-none" :disabled="loading">
                                    <span x-text="loading ? 'Memproses...' : 'Reset Password'"></span>
                                </button>
                                <div class="text-center">
                                    <a href="/auth/login" class="text-sm text-blue-400 hover:text-blue-300">Kembali ke login</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        function forgotData() {
            return {
                phone: '', loading: false, error: '', message: '',
                doReset() {
                    this.loading = true; this.error = ''; this.message = '';
                    fetch('/api/v1/forgot-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: this.phone })
                    })
                        .then(res => res.json())
                        .then(res => {
                            this.loading = false;
                            if (res.result) {
                                this.message = res.message || 'Password baru telah dikirim.';
                                this.phone = '';
                            } else {
                                this.error = res.message || 'Nomor tidak ditemukan.';
                            }
                        })
                        .catch(() => { this.loading = false; this.error = 'Terjadi kesalahan, coba lagi.'; });
                }
            };
        }
    </script>
</body>

                    <div class="relative backdrop-blur-2xl bg-white/10 p-8 rounded-2xl shadow-2xl border border-white/20 overflow-hidden">

                            <div>
                                <div class="flex justify-center mb-4">

                                        <div class="flex-shrink-0">

                                    <div class="flex items-center justify-between pt-2">

                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" /></svg>

                                        <label for="username" class="block text-sm font-medium text-white/90 pb-2">Username</label>

                                        <div class="relative">
                                            <input id="password" x-model="password" :type="showPass ? 'text' : 'password'" name="password" autocomplete="current-password" required class="relative block w-full appearance-none rounded-md border-0 bg-murky-200 px-3 py-2 pr-10 text-xs text-murky-800 placeholder-murky-800 focus:z-10 focus:border-transparent focus:outline-none focus:ring-transparent focus:bg-white" placeholder="Password">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        function loginData() {
            return {
                username: '',
                password: '',
                remember: true,
                showPass: false,
                loading: false,
                error: '',
                sitekey: '',
                widgetId: null,
                initTurnstile() {
                    fetch('/api/config/turnstile')
                        .then(res => res.json())
                        .then(res => {
                            if (res.result && res.sitekey) {
                                this.sitekey = res.sitekey;
                                this.renderWidget();
                            }
                        });
                },
                renderWidget() {
                    if (typeof turnstile !== 'undefined' && this.sitekey) {
                        this.widgetId = turnstile.render('#turnstile-container', {
                            sitekey: this.sitekey,
                            theme: 'dark'
                        });
                    } else {
                        setTimeout(() => this.renderWidget(), 100);
                    }
                },
                doLogin() {
                    let token = null;
                    if (this.widgetId !== null && typeof turnstile !== 'undefined') {
                        token = turnstile.getResponse(this.widgetId);
                        if (!token) {
                            this.error = 'Silakan selesaikan Captcha.';
                            return;
                        }
                    }

                    this.loading = true;
                    this.error = '';
                    fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: this.username, password: this.password, turnstile_token: token })
                    })
                        .then(res => res.json())
                        .then(res => {
                            this.loading = false;
                            if (res.result) {
                                localStorage.setItem('auth_token', res.token || '');
                                localStorage.setItem('auth_user', JSON.stringify({ username: res.username, level: res.level }));
                                window.location.href = '/account/';
                            } else {
                                this.error = res.message || 'Username atau password salah.';
                                if (this.widgetId !== null) turnstile.reset(this.widgetId);
                            }
                        })
                        .catch(() => {
                            this.loading = false;
                            this.error = 'Terjadi kesalahan, coba lagi.';
                            if (this.widgetId !== null) turnstile.reset(this.widgetId);
                        });
                }
            };
        }
    </script>

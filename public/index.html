        /* Animasi Dasar */
        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        @keyframes sakuraFall {
            0% { transform: translate(0, -10px) rotate(0deg); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translate(10px, 10px) rotate(360deg); opacity: 0; }
        }

        @keyframes floatAnimation {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }

        @keyframes shineEffect {
            0% { transform: translateX(-100%) rotate(-25deg); }
            100% { transform: translateX(100%) rotate(-25deg); }
        }

        /* Stil Komponen */
        .skeleton-berita {
            min-height: 180px;
            border-radius: 14px;
            overflow: hidden;
            background-color: rgba(74, 81, 87, 1);
            animation: pulse 1.5s infinite alternate;
        }

        .category-shadow-bg {
            position: relative;
            animation: floatAnimation 3s ease-in-out infinite;
        }

        .category-shadow-bg:hover {
            transform: translateY(-8px);
        }

        .category-shadow-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: inherit;
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            opacity: 0.3;
            z-index: -1;
            transition: all 0.3s ease;
        }

        .category-shadow-bg:hover::before {
            opacity: 0.5;
            filter: blur(12px);
        }

        .category-shadow-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, 
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.1) 50%,
                rgba(255,255,255,0) 100%);
            z-index: 1;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .category-shadow-bg:hover::after {
            opacity: 1;
            animation: shineEffect 2s infinite;
        }

        .featured-game-card {
            position: relative;
            transition: transform 0.3s ease;
            animation: floatAnimation 3s ease-in-out infinite;
        }

        .featured-game-card::before {
            content: '🌸';
            position: absolute;
            top: -20px;
            left: 50%;
            font-size: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .featured-game-card:hover::before {
            opacity: 1;
            animation: sakuraFall 3s ease-in-out infinite;
        }

        .featured-game-card .blur-sharp img {
            transition: all 0.5s ease;
        }

                    <div class="grid gap-8 mb-6 lg:mb-16 md:grid-cols-3">

                                <div class="skeleton-berita rounded-lg shadow w-full"></div>

    </main>

    <div id="site-footer"></div>

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const bubblesContainer = document.getElementById('bubbles-container');
            const colors = ['white', 'blue-200', 'purple-200', 'pink-200'];
            for(let i=0; i<15; i++) {
                const size = Math.floor(Math.random() * 60) + 20;
                const duration = Math.floor(Math.random() * 12) + 8;
                const delay = (Math.random() * 5).toFixed(3);
                const left = Math.floor(Math.random() * 100);
                const opacity = (Math.floor(Math.random() * 20) + 10) / 100;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                const li = document.createElement('li');
                li.className = `absolute rounded-full bg-${color}/${opacity*100} backdrop-blur-sm`;
                li.style.cssText = `width: ${size}px; height: ${size}px; left: ${left}%; animation: float ${duration}s linear infinite; animation-delay: ${delay}s; bottom: -150px;`;
                bubblesContainer.appendChild(li);
            }
        });

        function appData() {
            return {
                ...layoutData(),
                banners: [],
                popularGames: [],
                tabs: [],
                categories: {},
                allCategories: {},
                activeTab: 'mobile-game',
                news: [],
                flashsales: [],
                initApp() {
                    fetch('/api/v1/page-data')
                        .then(res => res.json())
                        .then(data => {
                            this.banners = (data.banners && data.banners.length > 0) ? data.banners : [
                                { id: 1, content: 'https://aruterushoppu.com/imagehome/Background-Aruteru-Shoppu.webp' }
                            ];
                            this.popularGames = data.popularGames || [];
                            this.tabs = data.tabs || [];
                            if (this.tabs.length > 0) {
                                this.activeTab = this.tabs[0].type;
                            }
                            this.categories = data.categories || {};
                            this.allCategories = JSON.parse(JSON.stringify(this.categories));
                            // Mirror PHP: show only first 12 categories per tab
                            Object.keys(this.categories).forEach(key => {
                                this.categories[key] = this.categories[key].slice(0, 12);
                            });
                            this.news = data.news || [];
                            this.flashsales = data.flashsale || [];
                            if (data.config) {
                                this.config = data.config;
                                applyConfigColors(this.config.colors);
                            }
                            if (data.config && data.config.popup) {
                                this.popup = data.config.popup;
                                const hidden = localStorage.getItem('hidePopupp') === 'true';
                                if (this.popup.show && !hidden) {
                                    this.$nextTick(() => { this.showPopup = true; });
                                }
                            }
                            if (this.config.flashsale_time) {
                                this.startFlashsaleTimer(this.config.flashsale_time);
                            }

                            this.$nextTick(() => {
                                if (window.Swiper) {
                                    new Swiper('.hero-swiper', {
                                        loop: true,
                                        autoplay: { delay: 4000, disableOnInteraction: false },
                                        pagination: { el: '.swiper-pagination', clickable: true },
                                        navigation: {
                                            nextEl: '.swiper-button-next',
                                            prevEl: '.swiper-button-prev',
                                        },
                                    });
                                }
                            });
                        })
                        .catch(err => console.error("Gagal memuat data web", err));
                },
                loadMore(type) {
                    const current = (this.categories[type] || []).length;
                    const all = this.allCategories[type] || [];
                    this.categories[type] = all.slice(0, current + 12);
                },
                startFlashsaleTimer(countDownDate) {
                    const target = new Date(countDownDate.replace(' ', 'T')).getTime();
                    const hoursEl = document.getElementById('hours');
                    const minutesEl = document.getElementById('minutes');
                    const secondsEl = document.getElementById('seconds');
                    if (!hoursEl || !minutesEl || !secondsEl) return;
                    const tick = () => {
                        const distance = target - new Date().getTime();
                        if (distance > 0) {
                            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                            hoursEl.textContent = hours.toString().padStart(2, '0');
                            minutesEl.textContent = minutes.toString().padStart(2, '0');
                            secondsEl.textContent = seconds.toString().padStart(2, '0');
                        } else {
                            clearInterval(this._fsTimer);
                            hoursEl.textContent = '00';
                            minutesEl.textContent = '00';
                            secondsEl.textContent = '00';
                            document.getElementById('expired_time_flash_sale').textContent = "Waktu sudah habis!";
                        }
                    };
                    tick();
                    this._fsTimer = setInterval(tick, 1000);
                },
                tryDecodeBase64(str) {
                    if (!str) return '';
                    try {
                        return atob(str);
                    } catch (e) {
                        return str;
                    }
                }
            }
        }
    </script>
    <script>
        function toggleCsOptions() {
            const options = document.getElementById('cs-options');
            if (options) {
                options.classList.toggle('hidden');
            }
        }
        document.addEventListener('click', function(event) {
            const csOptions = document.getElementById('cs-options');
            const csButton = event.target.closest('button');
            if (csOptions && !csButton && !csOptions.contains(event.target)) {
                csOptions.classList.add('hidden');
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            // Popup close logic (mirror popup.php)
            const dontShow = document.getElementById('dontshowinfoo');
            const popupStructure = document.querySelector('.popup-structuree');
            const closeButtons = document.querySelectorAll('.close-popup-buttonn');
            if (dontShow && popupStructure) {
                function closePopup() {
                    if (popupStructure) popupStructure.style.display = 'none';
                    if (dontShow && dontShow.checked) localStorage.setItem('hidePopupp', 'true');
                }
                dontShow.addEventListener('change', function() {
                    if (this.checked) closePopup();
                });
                closeButtons.forEach(btn => btn.addEventListener('click', closePopup));
            }

            // Meteor effects (mirror home.php 12 meteors)
            const meteorsContainer = document.getElementById('meteors-container');
            if (meteorsContainer) {
                const colors = ['white', 'blue-200', 'purple-200', 'pink-200'];
                for (let i = 0; i < 12; i++) {
                    const size = Math.floor(Math.random() * 3) + 1;
                    const duration = Math.floor(Math.random() * 3) + 3;
                    const delay = (Math.random() * 2).toFixed(3);
                    const left = Math.floor(Math.random() * 1500) - 500;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const span = document.createElement('span');
                    span.className = `absolute left-1/2 top-1/2 h-${size} w-${size} rotate-[215deg] animate-meteor-effect rounded-[9999px] bg-${color} shadow-[0_0_0_1px_#ffffff20]`;
                    span.style.cssText = `top: -20px; right: ${left}px; animation-delay: ${delay}s; animation-duration: ${duration}s;`;
                    meteorsContainer.appendChild(span);
                }
            }

            // Tab scroll left/right (mirror app.php)
            const scrollLeftBtn = document.getElementById('scrollLeft');
            const scrollRightBtn = document.getElementById('scrollRight');
            if (scrollLeftBtn) {
                scrollLeftBtn.addEventListener('click', function() {
                    document.querySelector('.tabs-container').scrollBy({ left: -100, behavior: 'smooth' });
                });
            }
            if (scrollRightBtn) {
                scrollRightBtn.addEventListener('click', function() {
                    document.querySelector('.tabs-container').scrollBy({ left: 100, behavior: 'smooth' });
                });
            }
        });
    </script>

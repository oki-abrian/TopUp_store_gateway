<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">

    <link rel="shortcut icon" href="/imagehome/Footeraru.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="https://unpkg.com/placeholder-loading/dist/css/placeholder-loading.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/library/assets/guest/css/header.css">
    <link rel="stylesheet" href="/library/assets/guest/css/mobile-menu.css">
    <link rel="stylesheet" href="/library/assets/guest/css/e00de8768e0e97d0dsddd0bb.css">
    <link rel="stylesheet" href="/library/assets/guest/css/app.css">
    <link rel="stylesheet" href="/library/assets/guest/css/home.css">
    <link rel="stylesheet" href="/library/assets/guest/css/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        murky: {
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                        },
                        'dark-new3': '#182232',
                        melpa: {
                            100: '#1e293b',
                        },
                        primary: {
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --warna_1: #1e293b;
            --warna_2: #0f172a;
            --warna_3: #6366f1;
            --warna_4: #334155;
            --primary-500: #6366f1;
            --murky-700-hover: #334155;
        }
        :root[data-theme="light"] {
            --warna_1: #ffffff;
            --warna_2: #f8f9fa;
            --warna_3: #007bff;
            --warna_4: #e9ecef;
            --primary-500: #007bff;
            --murky-700-hover: #dee2e6;
            --text-color: #343a40;
            --bg-color: #ffffff;
        }
        :root[data-theme="dark"] {
            --warna_1: #1e293b;
            --warna_2: #0f172a;
            --warna_3: #6366f1;
            --warna_4: #334155;
            --primary-500: #007bff;
            --murky-700-hover: #334155;
            --text-color: #ffffff;
            --menu-text: #ffffff;
            --bg-color: #0f172a;
        }
        [x-cloak] { display: none !important; }
        .desktop-nav-link, .mobile-nav-link { font-size: 12px; padding: 0.3rem 0.4rem; display: inline-flex; align-items: center; gap: 0.25rem; color: white; font-weight: 500; }
        [data-theme="dark"] .desktop-nav-link { color: white; font-weight: 500; }
        [data-theme="light"] .desktop-nav-link { color: #000000; font-weight: 600; }
    </style>
    <script defer src="//cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="text-white antialiased bg-[#0f172a]" data-aruteru-layout>
    <div id="site-header"></div>
    <main class="relative">
        <div id="app" x-data="reviewData()" x-init="initReview()">
            <section class="bg-murky-900 py-12">
                <div class="container">
                    <div class="mx-auto max-w-7xl">
                        <h2 class="mb-8 text-2xl font-bold text-white sm:text-3xl">Testimonials</h2>
                        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" id="testimonialCard">
                            <template x-for="r in reviews.slice(0, visibleCount)" :key="r.id">
                                <div class="TesimonialLoadsMore" id="testimonial">
                                    <div class="relative rounded-lg bg-murky-800 p-4 shadow-lg">
                                        <div class="mb-3">
                                            <div class="flex items-center justify-between">
                                                <div class="flex items-center gap-2">
                                                    <img src="https://cdn.iconscout.com/icon/free/png-256/free-chat-icon-download-in-svg-png-gif-file-formats--bubble-talk-message-communication-comment-android-user-interface-pack-icons-3297.png?f=webp" alt="Game Icon" class="h-6 w-6 rounded-full">
                                                    <h3 class="text-sm font-medium text-white" x-text="r.category"></h3>
                                                </div>
                                                <div class="flex items-center">
                                                    <template x-for="i in Math.min(r.rating, 5)" :key="'s' + i">
                                                        <i class="fa fa-star text-yellow-400"></i>
                                                    </template>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="mb-3">
                                            <p class="text-sm text-murky-300" x-text="r.message"></p>
                                        </div>
                                        <div class="flex items-center justify-between border-t border-murky-700 pt-3 text-xs">
                                            <div class="text-murky-400" x-text="hideString(r.order_id)"></div>
                                            <div class="flex items-center gap-4">
                                                <span class="text-murky-400" x-text="r.name"></span>
                                                <span class="text-murky-500" x-text="r.date"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </template>
                            <template x-if="reviews.length === 0">
                                <div class="col-span-3 text-center py-12 text-murky-400">Belum ada ulasan.</div>
                            </template>
                        </div>
                        <div class="mt-8 text-center" x-show="reviews.length > visibleCount" x-cloak>
                            <button @click="loadMore" class="inline-flex items-center justify-center rounded-md bg-murky-700 px-6 py-2 text-sm font-medium text-white hover:bg-murky-600 transition-colors">
                                <span>Tampilkan lebih banyak</span>
                                <i class="fas fa-chevron-down ml-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <div id="site-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/app-data.js"></script>
    <script>
        function reviewData() {
            return Object.assign(layoutData(), {
                reviews: [],
                visibleCount: 5,
                initReview() {
                    this.loadConfig();
                    fetchJSON('/api/v1/reviews')
                        .then(res => { this.reviews = res.data || []; })
                        .catch(err => console.error('Gagal muat ulasan', err));
                },
                loadMore() { this.visibleCount += 10; }
            });
        }
    </script>
</body>
</html>

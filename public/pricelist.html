    <style>

            --warna_1: #1e293b;
            --warna_2: #0f172a;

            --warna_3: #007bff;

            --primary-500: #007bff;

        }
        :root[data-theme="dark"] {

<body class="text-white antialiased bg-[#0f172a]" data-aruteru-layout>
    <div id="site-header"></div>
    <main class="relative">
        <div id="app" x-data="pricelistData()" x-init="initPricelist()">
            <section id="price-list" class="relative space-y-12 pb-24">
                <div class="relative flex items-center bg-gradient-to-r from-murky-700 to-murky-800 py-12 shadow-2xl">
                    <div class="absolute inset-0 opacity-20" style="background-image: url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciPjxkZWZzPjxwYXR0ZXJuIGlkPSJwYXR0ZXJuIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiIHBhdHRlcm5UcmFuc2Zvcm09InJvdGF0ZSg0NSkiPjxsaW5lIHgxPSIwIiB5PSIwIiB4Mj0iMCIgeTI9IjQwIiBzdHJva2U9InJnYmEoMjU1LDI1NSwyNTUsMC4xKSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSJ1cmwoI3BhdHRlcm4pIi8+PC9zdmc+')"></div>
                    <div class="container relative z-20">
                        <h2 class="max-w-2xl text-4xl font-bold tracking-tight text-white sm:text-5xl">Daftar Harga</h2>
                        <p class="mt-4 max-w-3xl text-lg text-murky-200">Temukan produk yang Anda inginkan dan lihat harga terbaik kami</p>
                    </div>
                </div>
                <div class="container">
                    <div class="space-y-6">
                        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
                            <div class="flex-1">
                                <select x-model="selectedCategory" @change="loadServices" class="w-full rounded-lg border border-murky-600 bg-murky-700 px-4 py-2.5 text-sm text-white transition-all duration-200 focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/20">
                                    <option value="" selected disabled>Pilih Produk</option>
                                    <template x-for="cat in categories" :key="cat.code">
                                        <option :value="cat.code" x-text="cat.name"></option>
                                    </template>
                                </select>
                            </div>
                            <div>
                                <button @click="loadServices" type="button" class="inline-flex items-center gap-2 rounded-lg bg-primary-600 px-4 py-2.5 text-sm font-medium text-white transition-all duration-200 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500/20">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" /></svg>
                                    Segarkan
                                </button>
                            </div>
                        </div>
                        <div class="overflow-hidden rounded-xl border border-murky-600 bg-murky-700 shadow-lg">
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-murky-600">
                                    <thead class="bg-murky-800/50">
                                        <tr>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-murky-300">Kode</th>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-murky-300">Nama</th>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-murky-300">Harga Tamu</th>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-murky-300">Harga Member</th>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-murky-300">Harga Reseller</th>
                                            <th scope="col" class="px-6 py-4 text-left text-xs font-semibold uppercase tracking-wider text-murky-300">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody id="result_filter" class="divide-y divide-murky-600">
                                        <template x-if="!selectedCategory">
                                            <tr class="bg-murky-700/50">
                                                <td colspan="6" class="px-6 py-8 text-center">
                                                    <div class="flex flex-col items-center justify-center space-y-2 text-murky-400">
                                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                                                        <p class="text-sm font-medium">Pilih Produk terlebih dahulu</p>
                                                    </div>
                                                </td>
                                            </tr>
                                        </template>
                                        <template x-if="selectedCategory && services.length === 0 && !loading">
                                            <tr class="bg-murky-700/50">
                                                <td colspan="6" class="px-6 py-8 text-center text-white text-sm">Produk sedang tidak tersedia</td>
                                            </tr>
                                        </template>
                                        <template x-for="svc in services" :key="svc.code">
                                            <tr class="even:bg-murky-700/50">
                                                <td class="px-6 py-4 text-xs font-medium text-white"><div class="whitespace-nowrap" x-text="svc.code"></div></td>
                                                <td class="px-6 py-4 text-xs font-medium text-white"><div class="whitespace-nowrap" x-text="svc.name"></div></td>
                                                <td class="px-6 py-4 text-xs font-medium text-white"><div class="whitespace-nowrap">Rp <span x-text="fmt(svc.price_tamu)"></span></div></td>
                                                <td class="px-6 py-4 text-xs font-medium text-white"><div class="whitespace-nowrap">Rp <span x-text="fmt(svc.price_member)"></span></div></td>
                                                <td class="px-6 py-4 text-xs font-medium text-white"><div class="whitespace-nowrap">Rp <span x-text="fmt(svc.price_reseller)"></span></div></td>
                                                <td class="px-6 py-4 text-xs font-medium">
                                                    <span x-show="svc.status === 'available'" class="inline-flex rounded-md px-2 text-xs font-semibold leading-5 bg-success text-white">Available</span>
                                                    <span x-show="svc.status !== 'available'" class="inline-flex rounded-md px-2 text-xs font-semibold leading-5 bg-danger text-white">Empty</span>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <div id="site-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/app-data.js"></script>
    <script>
        function pricelistData() {
            return Object.assign(layoutData(), {
                categories: [],
                selectedCategory: '',
                services: [],
                loading: false,
                initPricelist() {
                    this.loadConfig();
                    fetchJSON('/api/v1/page-data')
                        .then(data => {
                            const cats = [];
                            Object.keys(data.categories || {}).forEach(type => {
                                (data.categories[type] || []).forEach(c => {
                                    if (!cats.find(x => x.code === c.name)) {
                                        cats.push({ code: c.name, name: c.name });
                                    }
                                });
                            });
                            this.categories = cats;
                        })
                        .catch(err => console.error(err));
                },
                loadServices() {
                    if (!this.selectedCategory) return;
                    this.loading = true;
                    this.services = [];
                    fetchJSON('/api/v1/pricelist/' + encodeURIComponent(this.selectedCategory))
                        .then(res => { this.services = res.data || []; this.loading = false; })
                        .catch(() => { this.loading = false; });
                }
            });
        }
    </script>
</body>
</html>

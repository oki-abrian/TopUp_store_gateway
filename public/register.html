<body class="text-white antialiased bg-[#0f172a]" x-init="initTurnstile()">
    <div class="jsx-1305739042 __className_a8b5ca font-sans" x-data="registerData()">
        <div class="relative flex min-h-screen items-center justify-center px-4 sm:px-32 py-10">
            <div class="absolute top-4 left-4 z-20">
                <a class="inline-flex items-center justify-center rounded-md !bg-murky-700 !p-2 hover:!bg-murky-800 text-white" href="/" style="outline: none;">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="h-5 w-5"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>
                </a>
            </div>
            <div class="absolute inset-0 z-10 bg-gradient-to-b from-gray-900/90 to-gray-900/50"></div>
            <div class="z-20 w-full">
                <div class="mx-auto w-full max-w-md space-y-8 lg:mx-0 mt-5">
                    <div class="relative backdrop-blur-2xl bg-white/10 p-8 rounded-2xl shadow-2xl border border-white/20 overflow-hidden">
                        <div class="relative z-10">
                            <div>
                                <div class="flex justify-center mb-4">
                                    <img src="/imagehome/Footeraru.png" alt="Logo" class="h-16 w-auto" />
                                </div>
                                <h2 class="mt-2 text-2xl font-bold tracking-tight text-white sm:text-3xl text-center">Daftar</h2>
                                <div class="mt-4">
                                    <div class="flex items-center p-4 bg-gray-800/50 rounded-lg border border-gray-700/50">
                                        <div class="flex-shrink-0">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" /></svg>
                                        </div>
                                        <div class="ml-4"><p class="text-sm text-white/80">Buat akun baru untuk mulai berbelanja</p></div>
                                    </div>
                                    <div class="flex items-center justify-between pt-2">
                                        <span class="text-sm text-white/80">Sudah punya akun?</span>
                                        <a href="/auth/login" class="inline-flex items-center px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-all duration-300 hover:shadow-lg hover:-translate-y-0.5">Masuk</a>
                                    </div>
                                </div>
                            </div>
                            <div x-show="error" x-cloak class="mt-4 rounded-lg bg-red-500/10 border border-red-500/30 p-3 text-sm text-red-300" x-text="error"></div>
                            <template x-if="step === 1">
                                <form @submit.prevent="doRegister" class="mt-8 space-y-5">
                                    <div>
                                        <label class="block text-sm font-medium text-white/90 pb-2">Nama Lengkap</label>
                                        <input x-model="name" type="text" required class="relative block w-full appearance-none rounded-md border-0 bg-murky-200 px-3 py-2 text-xs text-murky-800 placeholder-murky-800 focus:z-10 focus:outline-none focus:bg-white" placeholder="Nama lengkap">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-white/90 pb-2">Username</label>
                                        <input x-model="username" type="text" required class="relative block w-full appearance-none rounded-md border-0 bg-murky-200 px-3 py-2 text-xs text-murky-800 placeholder-murky-800 focus:z-10 focus:outline-none focus:bg-white" placeholder="Username" onkeyup="this.value=this.value.replace(/[^A-Za-z0-9]/g,'')" minlength="5" maxlength="32">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-white/90 pb-2">Email</label>
                                        <input x-model="email" type="email" required class="relative block w-full appearance-none rounded-md border-0 bg-murky-200 px-3 py-2 text-xs text-murky-800 placeholder-murky-800 focus:z-10 focus:outline-none focus:bg-white" placeholder="email@example.com">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-white/90 pb-2">No. WhatsApp</label>
                                        <input x-model="phone" type="tel" required class="relative block w-full appearance-none rounded-md border-0 bg-murky-200 px-3 py-2 text-xs text-murky-800 placeholder-murky-800 focus:z-10 focus:outline-none focus:bg-white" placeholder="08xxxxxxxxxx" onkeyup="this.value=this.value.replace(/[^\d]+/g,'')" minlength="10" maxlength="15">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-white/90 pb-2">Password</label>
                                        <div class="relative">
                                            <input x-model="password" :type="showPass ? 'text' : 'password'" required minlength="6" class="relative block w-full appearance-none rounded-md border-0 bg-murky-200 px-3 py-2 pr-10 text-xs text-murky-800 placeholder-murky-800 focus:z-10 focus:outline-none focus:bg-white" placeholder="Minimal 6 karakter">
                                            <button type="button" @click="showPass = !showPass" class="absolute inset-y-0 right-0 pr-3 flex items-center text-murky-600 hover:text-murky-800" tabindex="-1">
                                                <i class="fa" :class="showPass ? 'fa-eye-slash' : 'fa-eye'"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-white/90 pb-2">Konfirmasi Password</label>
                                        <div class="relative">
                                            <input x-model="password2" :type="showPass ? 'text' : 'password'" required minlength="6" class="relative block w-full appearance-none rounded-md border-0 bg-murky-200 px-3 py-2 pr-10 text-xs text-murky-800 placeholder-murky-800 focus:z-10 focus:outline-none focus:bg-white" placeholder="Ulangi password">
                                            <button type="button" @click="showPass = !showPass" class="absolute inset-y-0 right-0 pr-3 flex items-center text-murky-600 hover:text-murky-800" tabindex="-1">
                                                <i class="fa" :class="showPass ? 'fa-eye-slash' : 'fa-eye'"></i>
                                            </button>
                                        </div>
                                    </div>
                                    <div id="turnstile-container" class="flex justify-center my-4"></div>
                                    <button type="submit" class="group relative flex w-full justify-center rounded-md bg-green-600 px-4 py-2 text-sm font-medium text-white duration-300 hover:bg-green-700 focus:outline-none" :disabled="loading">
                                        <span x-text="loading ? 'Memproses...' : 'Daftar'"></span>
                                    </button>
                                </form>
                            </template>
                            
                            <template x-if="step === 2">
                                <form @submit.prevent="verifyOtp" class="mt-8 space-y-5">
                                    <div class="p-4 bg-yellow-500/10 border border-yellow-500/20 text-yellow-300 text-sm rounded-lg mb-4">
                                        Demi keamanan, jangan bagikan OTP kepada orang lain.
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-white/90 pb-2">Kode OTP WhatsApp</label>
                                        <input x-model="otp" type="text" required class="relative block w-full appearance-none rounded-md border-0 bg-murky-200 px-3 py-2 text-xs text-murky-800 placeholder-murky-800 focus:z-10 focus:outline-none focus:bg-white" placeholder="Masukkan 6 digit OTP" maxlength="6">
                                    </div>
                                    <div class="flex justify-between items-center text-xs">
                                        <span x-text="cooldown > 0 ? `Tunggu ${cooldown} detik` : ''" class="text-white/80"></span>
                                        <button type="button" @click="resendOtp" class="text-blue-400 hover:text-blue-300 disabled:opacity-50" :disabled="cooldown > 0 || loading">Kirim Ulang OTP</button>
                                    </div>
                                    <button type="submit" class="group relative flex w-full justify-center rounded-md bg-primary-500 px-4 py-2 text-sm font-medium text-white duration-300 hover:bg-primary-400 focus:outline-none" :disabled="loading">
                                        <span x-text="loading ? 'Memproses...' : 'Verifikasi'"></span>
                                    </button>
                                    <button type="button" @click="step = 1; otp = ''; error = ''" class="group relative flex w-full justify-center rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white duration-300 hover:bg-red-500 focus:outline-none">
                                        Kembali
                                    </button>
                                </form>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>
        function registerData() {
            return {
                step: 1,
                name: '', username: '', email: '', phone: '', password: '', password2: '',
                otp: '', session_id: '',
                showPass: false,
                loading: false, error: '',
                cooldown: 0,
                sitekey: '',
                widgetId: null,
                initTurnstile() {
                    fetch('/api/config/turnstile')
                        .then(res => res.json())
                        .then(res => {
                            if (res.result && res.sitekey) {
                                this.sitekey = res.sitekey;
                                this.renderWidget();
                            }
                        });
                },
                renderWidget() {
                    if (this.step !== 1) return;
                    if (typeof turnstile !== 'undefined' && this.sitekey) {
                        this.widgetId = turnstile.render('#turnstile-container', {
                            sitekey: this.sitekey,
                            theme: 'dark'
                        });
                    } else {
                        setTimeout(() => this.renderWidget(), 100);
                    }
                },
                startCooldown() {
                    this.cooldown = 120;
                    const timer = setInterval(() => {
                        this.cooldown--;
                        if (this.cooldown <= 0) clearInterval(timer);
                    }, 1000);
                },
                doRegister() {
                    if (this.password !== this.password2) { this.error = 'Konfirmasi password tidak cocok.'; return; }
                    
                    let token = null;
                    if (this.widgetId !== null && typeof turnstile !== 'undefined') {
                        token = turnstile.getResponse(this.widgetId);
                        if (!token) {
                            this.error = 'Silakan selesaikan Captcha.';
                            return;
                        }
                    }

                    this.loading = true; this.error = '';
                    fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: this.name, username: this.username, email: this.email, phone: this.phone, password: this.password, turnstile_token: token })
                    })
                        .then(res => res.json())
                        .then(res => {
                            this.loading = false;
                            if (res.result) {
                                this.session_id = res.session_id;
                                this.step = 2;
                                this.startCooldown();
                            } else {
                                this.error = res.message || 'Registrasi gagal.';
                                if (this.widgetId !== null) turnstile.reset(this.widgetId);
                            }
                        })
                        .catch(() => { 
                            this.loading = false; this.error = 'Terjadi kesalahan, coba lagi.'; 
                            if (this.widgetId !== null) turnstile.reset(this.widgetId);
                        });
                },
                verifyOtp() {
                    if (!this.otp) { this.error = 'Kode OTP tidak boleh kosong.'; return; }
                    this.loading = true; this.error = '';
                    fetch('/api/auth/register-step2', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: this.session_id, otp: this.otp })
                    })
                        .then(res => res.json())
                        .then(res => {
                            this.loading = false;
                            if (res.result) {
                                alert(res.message || 'Registrasi berhasil');
                                window.location.href = '/auth/login';
                            } else {
                                this.error = res.message || 'OTP salah.';
                            }
                        })
                        .catch(() => { this.loading = false; this.error = 'Terjadi kesalahan, coba lagi.'; });
                },
                resendOtp() {
                    if (this.cooldown > 0) return;
                    this.loading = true; this.error = '';
                    fetch('/api/auth/register-resend', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session_id: this.session_id })
                    })
                        .then(res => res.json())
                        .then(res => {
                            this.loading = false;
                            if (res.result) {
                                alert(res.message || 'OTP berhasil dikirim ulang');
                                this.startCooldown();
                            } else {
                                this.error = res.message || 'Gagal kirim ulang OTP.';
                            }
                        })
                        .catch(() => { this.loading = false; this.error = 'Terjadi kesalahan, coba lagi.'; });
                }
            };
        }
    </script>

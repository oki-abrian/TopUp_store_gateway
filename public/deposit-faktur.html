<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
    <meta content="Aruteru Shoppu Top Up Game" name="description">
    <meta name="author" content="Sahabat Store x DhaMus">
    <title>Tagihan Deposit — Aruteru Shoppu</title>
    <link rel="shortcut icon" href="/imagehome/Footeraru.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/library/assets/guest/css/e00de8768e0e97d0dsddd0b0.css">
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/library/assets/guest/css/header.css">
    <link rel="stylesheet" href="/library/assets/guest/css/mobile-menu.css">
    <link rel="stylesheet" href="/library/assets/guest/css/e00de8768e0e97d0dsddd0bb.css">
    <link rel="stylesheet" href="/library/assets/guest/css/app.css">
    <link rel="stylesheet" href="/library/assets/guest/css/home.css">
    <link rel="stylesheet" href="/library/assets/guest/css/order.css">
    <link rel="stylesheet" href="/library/assets/guest/css/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        murky: {
                            200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b',
                            600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a'
                        },
                        'dark-new3': '#182232',
                        primary: { 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <style>
        :root { --warna_1:#1e293b; --warna_2:#0f172a; --warna_3:#6366f1; --warna_4:#334155; }
        [x-cloak] { display: none !important; }
        .timeline-dot { width: 12px; height: 12px; border-radius: 9999px; flex: none; margin-top: 5px; }
    </style>
    <script defer src="//cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="text-white antialiased bg-[#0f172a]" data-aruteru-layout>
    <div id="site-header"></div>

    <main class="relative">
        <div x-data="depositData()" x-init="initDeposit()">
            <div class="container py-12 md:py-16">
                <div class="max-w-2xl mx-auto text-center mb-8">
                    <img src="https://i.ibb.co.com/Fbdv8cQH/payy.gif" alt="Payment Image" class="mx-auto mt-2" width="160" height="auto" />
                    <p class="mt-2 text-3xl font-bold tracking-tight">Tagihan Deposit.</p>
                    <p class="mt-2 text-sm text-murky-400">Selesaikan pembayaran deposit Anda. Halaman ini diperbarui otomatis setiap 2 detik.</p>
                </div>

                <template x-if="dep.deposit_id">
                    <div class="max-w-2xl mx-auto space-y-6">
                        <!-- Payment action block -->
                        <div class="rounded-xl bg-dark-new3 p-6 border border-murky-600">
                            <div class="flex items-center justify-between flex-wrap gap-3">
                                <div>
                                    <p class="text-xs text-murky-400">ID Deposit</p>
                                    <div class="flex items-center gap-2">
                                        <span class="font-bold text-lg" x-text="dep.deposit_id"></span>
                                        <button @click="copyText(dep.deposit_id)" class="text-primary-400 hover:text-primary-300"><i class="fa fa-copy"></i></button>
                                    </div>
                                </div>
                                <span class="px-3 py-1 rounded-full text-xs font-semibold capitalize"
                                    :class="statusClass(dep.status)" x-text="cap(dep.status)"></span>
                            </div>

                            <div class="mt-6" x-show="dep.status === 'unpaid'">
                                <!-- QR -->
                                <template x-if="dep.payment_kind === 'qr' && dep.payment_action">
                                    <div class="text-center">
                                        <img :src="'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=' + encodeURIComponent(dep.payment_action)"
                                            alt="QRIS" class="mx-auto bg-white p-2 rounded-lg" width="220" height="220" />
                                        <p class="mt-3 text-xs text-yellow-300">Scan QRIS di atas menggunakan aplikasi e-wallet / m-banking Anda.</p>
                                    </div>
                                </template>
                                <!-- Pay URL -->
                                <template x-if="dep.payment_kind === 'url' && dep.payment_action">
                                    <a :href="dep.payment_action" target="_blank"
                                        class="block w-full text-center rounded-lg bg-primary-500 px-4 py-3 text-sm font-semibold text-white hover:bg-primary-400">
                                        Bayar Sekarang <i class="fa fa-arrow-right ml-1"></i>
                                    </a>
                                </template>
                                <!-- VA -->
                                <template x-if="dep.payment_kind === 'va' && dep.payment_action">
                                    <div class="rounded-lg bg-murky-800 p-4">
                                        <p class="text-xs text-murky-400 mb-1">Nomor Virtual Account</p>
                                        <div class="flex items-center justify-between gap-2">
                                            <span class="font-mono font-bold text-lg break-all" x-text="dep.payment_action"></span>
                                            <button @click="copyText(dep.payment_action)" class="flex-none text-primary-400 hover:text-primary-300"><i class="fa fa-copy"></i></button>
                                        </div>
                                    </div>
                                </template>
                                <!-- Manual guide -->
                                <template x-if="dep.payment_kind === 'guide'">
                                    <div class="rounded-lg bg-murky-800 p-4 text-sm whitespace-pre-line" x-text="dep.guide || dep.payment_action"></div>
                                </template>
                            </div>

                            <div class="mt-4 rounded-lg bg-emerald-500/10 border border-emerald-500/30 p-3 text-sm text-emerald-300" x-show="dep.status === 'paid'" x-cloak>
                                <i class="fa fa-check-circle mr-1"></i> Pembayaran diterima. Saldo telah ditambahkan ke akun Anda.
                            </div>
                        </div>

                        <!-- Rincian -->
                        <div class="rounded-xl bg-dark-new3 p-6 border border-murky-600" x-data="{ open: true }">
                            <button @click="open = !open" class="w-full flex items-center justify-between text-left">
                                <span class="font-medium">Rincian Pembayaran</span>
                                <i class="fa transition-transform" :class="open ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
                            </button>
                            <div x-show="open" x-collapse class="mt-4 space-y-2 text-sm">
                                <div class="flex justify-between"><span class="text-murky-400">Metode</span><span x-text="dep.method || '-'"></span></div>
                                <div class="flex justify-between"><span class="text-murky-400">Jumlah Request</span><span>Rp <span x-text="fmt(dep.amount)"></span></span></div>
                                <div class="flex justify-between"><span class="text-murky-400">Biaya Layanan</span><span>Rp <span x-text="fmt(dep.fee)"></span></span></div>
                                <div class="flex justify-between"><span class="text-murky-400">Kode Unik</span><span>Rp <span x-text="fmt(dep.uniq)"></span></span></div>
                                <div class="border-t border-murky-600 pt-2 mt-2 flex justify-between font-bold">
                                    <span>Total Transfer</span><span class="text-primary-400">Rp <span x-text="fmt(dep.total)"></span></span>
                                </div>
                            </div>
                        </div>

                        <!-- Timeline -->
                        <div class="rounded-xl bg-dark-new3 p-6 border border-murky-600">
                            <h3 class="font-medium mb-4">Status Transaksi</h3>
                            <div class="space-y-4 text-sm">
                                <div class="flex gap-3">
                                    <div class="timeline-dot bg-emerald-400"></div>
                                    <div><p>Deposit dibuat</p><p class="text-xs text-murky-400" x-text="dep.date || '-'"></p></div>
                                </div>
                                <div class="flex gap-3" x-show="dep.expired">
                                    <div class="timeline-dot" :class="dep.status === 'unpaid' ? 'bg-yellow-400' : 'bg-murky-500'"></div>
                                    <div><p>Batas waktu pembayaran</p><p class="text-xs text-murky-400" x-text="dep.expired || '-'"></p></div>
                                </div>
                                <div class="flex gap-3">
                                    <div class="timeline-dot" :class="timelineFinal"></div>
                                    <div>
                                        <p x-text="timelineLabel"></p>
                                        <p class="text-xs text-murky-400" x-text="dep.status === 'paid' ? 'Saldo berhasil ditambahkan' : ''"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <template x-if="loaded && !dep.deposit_id">
                    <div class="max-w-md mx-auto text-center py-10">
                        <p class="text-red-400">Deposit tidak ditemukan.</p>
                        <a href="/account" class="mt-3 inline-block rounded-lg bg-primary-500 px-4 py-2 text-sm text-white hover:bg-primary-400">Kembali ke Akun</a>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/app-data.js"></script>
    <script>
        function depositData() {
            return Object.assign(layoutData(), {
                dep: {},
                did: '',
                loaded: false,
                initDeposit() {
                    this.loadConfig();
                    const parts = window.location.pathname.split('/').filter(Boolean);
                    this.did = parts[parts.length - 1] || '';
                    this.loadDeposit();
                    this._timer = setInterval(() => this.poll(), 2000);
                },
                loadDeposit() {
                    return fetchJSON('/api/v1/deposit/' + encodeURIComponent(this.did))
                        .then(res => {
                            this.loaded = true;
                            if (res.result) this.dep = res.data;
                        })
                        .catch(() => { this.loaded = true; });
                },
                poll() {
                    fetchJSON('/api/v1/deposit/' + encodeURIComponent(this.did))
                        .then(res => {
                            if (res.result && res.data && res.data.status !== this.dep.status) {
                                location.reload();
                            }
                        })
                        .catch(() => {});
                },
                get timelineFinal() {
                    const s = this.dep.status;
                    if (s === 'paid') return 'bg-emerald-400';
                    if (s === 'cancel' || s === 'refund') return 'bg-red-400';
                    return 'bg-murky-500';
                },
                get timelineLabel() {
                    const s = this.dep.status;
                    if (s === 'paid') return 'Pembayaran diterima';
                    if (s === 'cancel') return 'Deposit dibatalkan';
                    if (s === 'refund') return 'Deposit dikembalikan';
                    return 'Menunggu pembayaran';
                },
                statusClass(s) {
                    const map = { unpaid: 'bg-yellow-300 text-yellow-900', paid: 'bg-emerald-200 text-emerald-900', cancel: 'bg-danger text-white', refund: 'bg-danger text-white' };
                    return map[s] || 'bg-yellow-300 text-yellow-900';
                },
                cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; },
                copyText(t) { copyToClipboard(t); showToast('successfully copied to the clipboard!', 'success'); },
                fmt
            });
        }
    </script>
</body>
</html>

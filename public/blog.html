<body class="text-white antialiased bg-[#0f172a]" data-aruteru-layout>
    <div id="site-header"></div>
    <main class="relative">
        <div id="app" x-data="blogData()" x-init="initBlog()">
            <section class="bg-murky-800 py-8">
                <div class="mx-auto max-w-screen-xl px-4">
                    <div class="mx-auto max-w-5xl">
                        <div>
                            <img class="w-full rounded-lg" :src="blog.banner" alt="" />
                        </div>
                        <h2 class="mt-6 text-2xl font-semibold text-white sm:text-2xl" x-text="blog.title"></h2>
                        <div class="mx-auto max-w-2xl space-y-6">
                            <p class="font-normal text-white"><p x-html="blog.content_html"></p></p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <div id="site-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <script src="/assets/js/layout.js"></script>
    <script src="/assets/js/app-data.js"></script>
    <script>
        function blogData() {
            return Object.assign(layoutData(), {
                blog: {},
                initBlog() {
                    this.loadConfig();
                    const parts = window.location.pathname.split('/').filter(Boolean);
                    const slug = parts[parts.length - 1] || '';
                    fetchJSON('/api/v1/blog/' + encodeURIComponent(slug))
                        .then(res => {
                            if (!res.result) { window.location.href = '/'; return; }
                            this.blog = res.data;
                        })
                        .catch(() => { window.location.href = '/'; });
                }
            });
        }
    </script>
